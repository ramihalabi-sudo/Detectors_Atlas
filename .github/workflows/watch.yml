name: Detector Atlas - scan manufacturer catalogs
on:
  schedule:
    - cron: '17 */6 * * *' # Every 6h UTC; scheduling is best effort
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: detector-atlas-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: pip install -r requirements.txt
      - name: Scan official manufacturer pages
        run: python watcher/update_catalog.py --root .
      - name: Save baseline and catalog history to repository
        run: |
          git config user.name "detector-atlas-bot"
          git config user.email "detector-atlas-bot@users.noreply.github.com"
          git add data/catalog.json data/source_state.json data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh EO detector source watch"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p _pages/data
          cp index.html _pages/index.html
          cp data/live.json _pages/data/live.json
          touch _pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Publish refreshed Detector Atlas website
        id: deployment
        uses: actions/deploy-pages@v4
